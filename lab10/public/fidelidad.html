<!DOCTYPE html>
<html>
<head>
  <title>Sistema de Fidelidad</title>
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <h1>Regístrate en nuestro sistema de fidelidad</h1>
  <form method="POST" action="/fidelidad">
    Nombre: <input type="text" name="nombre" required><br>
    Correo: <input type="email" name="correo" required><br>
    Puntos iniciales: <input type="number" name="puntos" value="0"><br>
    <button type="submit">Enviar</button>
  </form>

  <footer>
    <a href="/">Inicio</a>
    <a href="/menu">Menú</a>
    <a href="/fidelidad">Rewards</a>
    <a href="/admin">Perfil</a>
  </footer>
</body>
</html>
