<!DOCTYPE html>
<html>
<head>
  <title>Ejercicio 4</title>
</head>
<body>
<script>
  function promedios(matriz) {
    return matriz.map(fila => {
      let suma = fila.reduce((a,b) => a+b, 0);
      return suma / fila.length;
    });
  }

  // Pruebas
  console.assert(promedios([[1,2,3],[4,5,6]])[0] === 2);
  console.assert(promedios([[1,2,3],[4,5,6]])[1] === 5);

  document.write(promedios([[1,2,3],[4,5,6]]));
</script>
</body>
</html>
