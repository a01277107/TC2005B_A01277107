<!DOCTYPE html>
<html>
<head>
  <title>Ejercicio 3</title>
</head>
<body>
<script>
  function contador(arr) {
    let negativos = 0, ceros = 0, positivos = 0;
    for (let num of arr) {
      if (num < 0) negativos++;
      else if (num === 0) ceros++;
      else positivos++;
    }
    return {negativos, ceros, positivos};
  }

  // Pruebas
  console.assert(contador([-1,0,2,-3,5]).negativos === 2);
  console.assert(contador([-1,0,2,-3,5]).ceros === 1);
  console.assert(contador([-1,0,2,-3,5]).positivos === 2);

  document.write(JSON.stringify(contador([-1,0,2,-3,5])));
</script>
</body>
</html>
